name: pytest

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen Phase 6 self-repository commit
        run: git cat-file -e '12391233daa2149ead4f451e920b2e0d8a1a6beb^{commit}'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Import and lazy-startup smoke
        run: python -c "import config, processor, project_intelligence; assert config._active_client is None"
      - name: Build Gradio UI without a Provider request
        run: python -c "from ui import create_ui; demo = create_ui(); assert demo is not None"
      - name: Run full offline regression
        run: python scripts/dev.py test full
